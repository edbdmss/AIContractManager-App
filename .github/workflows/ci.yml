name: App CI and Android delivery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/yueun/cicd]
  workflow_dispatch:
    inputs:
      build_android:
        type: boolean
        description: Build Android after CI
        default: false
      profile:
        type: choice
        description: EAS profile
        options: [preview, development, production]
        default: preview
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: android-release
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
        run: eas build --platform android --profile "$BUILD_PROFILE" --non-interactive --wait
